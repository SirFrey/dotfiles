# ~/.psmux.conf — ported from WSL2 ~/.config/tmux/tmux.conf
# Catppuccin Frappe palette is hardcoded (no plugin support in psmux).

# --- Core / QoL ----------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -s escape-time 0
setw -g aggressive-resize on
set -g set-clipboard on
set -g display-panes-time 2000
set -g display-time 2000

# Bell: flag the window in status, no audible ring.
set -g visual-bell off
set -g bell-action any
set -g monitor-activity off

# Window/pane indexing
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Windows Terminal keeps Ctrl+V as paste, so Ctrl+Q also toggles rectangle (as in Vim on Windows).
bind-key -T copy-mode-vi C-q send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Pane navigation -----------------------------------------------------
# Prefix + h/j/k/l — backup, always safe.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Bare Ctrl+h/j/k/l — no prefix. Overrides shell-level Backspace (^H),
# LF (^J), KillLine (^K), and Clear-Screen (^L) when typed inside a psmux pane.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Alt-Arrow kept as a third option (Windows Terminal may still eat these).
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -r H swap-pane -U
bind -r L swap-pane -D

# --- Window navigation ---------------------------------------------------
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# --- Splits / new window keep cwd ----------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"
bind c  new-window      -c "#{pane_current_path}"

# --- Pane / session management ------------------------------------------
bind a setw synchronize-panes \; display-message "sync-panes toggled"
bind b break-pane -d
bind C-b choose-window 'join-pane -h -s "%%"'
bind g choose-tree -Zs
bind r source-file ~/.psmux.conf \; display-message "psmux.conf reloaded"

# --- Floating scratchpad -------------------------------------------------
# Alt-` (no prefix) or prefix + ` toggle a persistent "scratch" session in a popup.
bind -n "M-\`" if-shell -F '#{==:#{session_name},scratch}' \
  { detach-client } \
  { display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "psmux new-session -A -s scratch" }
bind '`' if-shell -F '#{==:#{session_name},scratch}' \
  { detach-client } \
  { display-popup -E -w 85% -h 80% -d "#{pane_current_path}" "psmux new-session -A -s scratch" }

# --- Catppuccin Frappe palette (hardcoded) -------------------------------
# rosewater #f2d5cf  flamingo #eebebe  pink #f4b8e4   mauve #ca9ee6
# red       #e78284  maroon   #ea999c  peach #ef9f76  yellow #e5c890
# green     #a6d189  teal     #81c8be  sky #99d1db    sapphire #85c1dc
# blue      #8caaee  lavender #babbf1
# text #c6d0f5  subtext1 #b5bfe2  subtext0 #a5adce
# overlay2 #949cbb  overlay1 #838ba7  overlay0 #737994
# surface2 #626880  surface1 #51576d  surface0 #414559
# base #303446  mantle #292c3c  crust #232634

# --- Status bar ---------------------------------------------------------
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#c6d0f5"

set -g status-left-length 60
set -g status-right-length 80

# Left: session name in green (red while prefix held), then a separator.
set -g status-left "#[bold,fg=#{?client_prefix,#e78284,#a6d189}]     #S #[default,fg=#737994]| "

# Right: zoom / sync / copy flags, then clock.
set -g status-right "#[fg=#e5c890]#{?window_zoomed_flag,  ZOOM ,}#[fg=#e78284]#{?pane_synchronized,  SYNC ,}#[fg=#99d1db]#{?pane_in_mode,  COPY ,}#[fg=#a5adce] %H:%M "

# Window tabs: drop tmux's #F flag noise; show bell '!' and zoom 'Z' manually.
set -g window-status-separator ""
set -g window-status-style         "fg=#babbf1"
set -g window-status-current-style "bold,underscore,fg=#ef9f76"
set -g window-status-format         " #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag, Z,} "
set -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "

# Pane borders
set -g pane-border-style        "fg=#626880"
set -g pane-active-border-style "fg=#ef9f76"

# Message / mode styles
set -g message-style         "bg=default,fg=#e5c890"
set -g message-command-style "bg=default,fg=#e5c890"
set -g mode-style            "bg=#414559,fg=#e5c890"

# --- Per-window color picker --------------------------------------------
# prefix + C-w then one letter assigns a tab color via @window_color.
# Requires the window-status-format references below to consult it.
set -g window-status-format         "#{?@window_color,#[fg=#{@window_color}],#[fg=#babbf1]} #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#{?@window_color,#[bold,underscore,fg=#{@window_color}],#[bold,underscore,fg=#ef9f76]} #I #W#{?window_zoomed_flag, Z,} "

bind C-w switch-client -T window-color
bind -T window-color g set -w @window_color "#a6d189"
bind -T window-color r set -w @window_color "#e78284"
bind -T window-color y set -w @window_color "#e5c890"
bind -T window-color b set -w @window_color "#8caaee"
bind -T window-color m set -w @window_color "#ca9ee6"
bind -T window-color p set -w @window_color "#ef9f76"
bind -T window-color t set -w @window_color "#81c8be"
bind -T window-color l set -w @window_color "#babbf1"
bind -T window-color k set -w @window_color "#f4b8e4"
bind -T window-color s set -w @window_color "#99d1db"
bind -T window-color u set -uw @window_color

# --- F12 nested-psmux passthrough ---------------------------------------
# Outer psmux drops its prefix + key-table so an inner tmux/psmux receives
# all keys. F12 again to restore.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set -g status-style "bg=#414559,fg=#737994" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  display-message "psmux OFF — F12 to restore" \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -gu status-style \;\
  set -g status-style "bg=default,fg=#c6d0f5" \;\
  display-message "psmux ON" \;\
  refresh-client -S

# Terminal tab title (Windows Terminal tab switcher): window emoji marks the
# PowerShell side; WSL tmux uses a penguin.
set -g set-titles on
set -g set-titles-string "🪟 #S · #W"

# --- Windows Terminal command palette -------------------------------------
# Each "# wt:" line becomes a palette entry ("psmux: <description>") that types
# the key into the focused pane. Format: # wt: prefix|root <key> | <description>
# Picked up the next time a PowerShell window starts (profile.ps1 regenerates
# when this file changes), or via "Palette: Regenerate entries".
# wt: prefix g | Session tree
# wt: prefix c | New window here
# wt: prefix % | Split right
# wt: prefix " | Split down
# wt: prefix z | Zoom pane
# wt: prefix , | Rename window
# wt: root M-` | Scratch popup
# wt: prefix a | Toggle synchronized panes
# wt: prefix b | Send pane to its own window
# wt: prefix [ | Copy mode
# wt: prefix r | Reload config
